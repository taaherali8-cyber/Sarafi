<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر صرافی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--sf:#fff;--tx:#14213d;--mu:#6b7686;--ln:#d9dfe6;--ac:#0b6e63;--ac2:#fff;--up:#0b7a4b;--dn:#b3261e;--hi:#f2b705;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--sf:#17222f;--tx:#e8edf3;--mu:#97a3b3;--ln:#2a3948;--ac:#35c4b3;--ac2:#06231f;--up:#4fd08e;--dn:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1621;--sf:#17222f;--tx:#e8edf3;--mu:#97a3b3;--ln:#2a3948;--ac:#35c4b3;--ac2:#06231f;--up:#4fd08e;--dn:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,SarrafiFont,Tahoma,sans-serif;font-size:15px;line-height:1.7;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 12px;font-weight:800}
h2{font-size:15px;margin:18px 0 8px;font-weight:600}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .box{margin:0}
.k{color:var(--mu);font-size:12px}
.v{font-size:20px;font-weight:800;direction:ltr;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:right}
th{color:var(--mu);font-weight:600}
td.n{direction:ltr;text-align:right}
.scroll{overflow-x:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
input.num{direction:ltr;text-align:right}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 14px;background:var(--ac);color:var(--ac2);font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button.x{background:transparent;color:var(--dn);padding:2px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.seg button.on.b{background:var(--up);color:#fff;border-color:var(--up)}
.seg button.on.s{background:var(--dn);color:#fff;border-color:var(--dn)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.big button{padding:24px 8px;font-size:19px;font-weight:800;color:var(--ac2)}.big .b{background:var(--up)}.big .s{background:var(--dn)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.msg{padding:8px 10px;border-radius:8px;margin:10px 0;font-size:13px;background:var(--bg);border:1px solid var(--ln)}
.msg.e{color:var(--dn);border-color:var(--dn)}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.day{color:var(--mu);font-size:12px;margin:12px 0 4px}
html:root[data-theme="gg"]{--bgimg:radial-gradient(60% 40% at 12% 8%,#35d39a88,transparent),radial-gradient(50% 40% at 92% 28%,#12a58d99,transparent),radial-gradient(60% 50% at 30% 100%,#8be8ae55,transparent),linear-gradient(160deg,#10503e,#082a22);--bg:#0a2e26;--sf:rgba(255,255,255,.13);--tx:#f3fbf7;--mu:#b9d9cc;--ln:rgba(255,255,255,.24);--ac:#7df0c0;--ac2:#06251c;--up:#7df0c0;--dn:#ffa196;--hi:#ffe08a}
html:root[data-theme="gs"]{--bgimg:radial-gradient(60% 40% at 12% 8%,#ffffff40,transparent),radial-gradient(50% 40% at 92% 30%,#7f93ab66,transparent),radial-gradient(60% 50% at 30% 100%,#ffffff22,transparent),linear-gradient(160deg,#4b535d,#22272d);--bg:#2b3036;--sf:rgba(255,255,255,.12);--tx:#f4f6f8;--mu:#bcc5cf;--ln:rgba(255,255,255,.24);--ac:#dbe4ee;--ac2:#1d2227;--up:#8ee9b8;--dn:#ffa196;--hi:#ffe08a}
body{background:var(--bgimg,var(--bg));background-attachment:fixed;padding-bottom:110px}
:root[data-theme^="g"] .box,:root[data-theme^="g"] nav,:root[data-theme^="g"] #lk{-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 32px rgba(0,0,0,.2)}
:root[data-theme^="g"] input,:root[data-theme^="g"] select,:root[data-theme^="g"] textarea,:root[data-theme^="g"] .seg button{background:rgba(255,255,255,.1);border-color:var(--ln)}
:root[data-theme^="g"] select option{color:#14213d}
:root[data-theme^="g"] ::placeholder{color:var(--mu)}
.box{border-radius:20px;padding:14px}
h1{font-size:20px}.v{font-size:23px}
.big button{border-radius:22px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border:1px solid var(--ln);border-radius:28px;padding:6px;gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;border-radius:22px;padding:8px 4px}
nav button.on{box-shadow:none;background:rgba(127,140,150,.25)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.th{background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:14px}.th.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;vertical-align:-2px}
.sw.gg{background:linear-gradient(135deg,#35d39a,#10503e)}.sw.gs{background:linear-gradient(135deg,#a4aebb,#2b3036)}.sw.light{background:#fff;border:1px solid #ccc}.sw.dark{background:#0e1621;border:1px solid #444}
#lk{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bgimg,var(--bg));color:var(--tx)}
body{min-height:100vh;background-attachment:scroll}
:root[data-theme^="g"] .box,:root[data-theme^="g"] nav,:root[data-theme^="g"] #lk{-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%)}
html.lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}
html.lite:root[data-theme^="g"] .box{background:rgba(255,255,255,.17)}
.bigc{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.bigc button{display:flex;align-items:center;justify-content:space-between;padding:24px 22px;font-size:22px;font-weight:800;border-radius:26px;color:var(--ac2);text-align:right;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.bigc small{display:block;font-size:12px;font-weight:400;opacity:.85}
.bigc .b{background:var(--up)}.bigc .s{background:var(--dn)}.bigc .c{background:var(--ac)}

<body>
<main id="app"></main>
<div id="ft">تمام حقوق این برنامه متعلق به حسین اخلاقی می‌باشد.</div>
<nav id="nav"></nav>
<script>
var KEY='sarrafi_v1';
var PRESET=['دلار','یورو','پوند','روپیه هند','روپیه پاکستان','افغانی','دینار عراق','درهم امارات','ریال عمان','دینار کویت','ریال قطر','دینار بحرین','ریال سعودی','لیر ترکیه'];
var S={cash:0,cur:{},tx:[],nid:1};
var tab='sum',type='buy',msg=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.cur||!Object.keys(S.cur).length){S.cur={};PRESET.forEach(function(n){S.cur[n]={q:0,c:0}})}
function save(){_c=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fa2en(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٬,،\s]/g,'').replace('٫','.')}
function num(s){var n=parseFloat(fa2en(s));return isNaN(n)?0:n}
function f(n,d){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d==null?0:d})}
function jd(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'long',day:'numeric'})}catch(e){return iso}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// محاسبه: میانگین موزون قیمت خرید
function calcRaw(){
  var st={},cash=S.cash||0,total=0,daily={};
  Object.keys(S.cur).forEach(function(n){st[n]={q:S.cur[n].q||0,c:S.cur[n].c||0}});
  var list=S.tx.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id-b.id});
  list.forEach(function(t){
    if(t.t==='conv'){var a=st[t.cu]||(st[t.cu]={q:0,c:0}),b=st[t.cu2]||(st[t.cu2]={q:0,c:0}),p=0,rem=t.q,r2=t.q*a.c/t.q2,rb=t.q2;a.q-=t.q;if(b.q<0){var cb=Math.min(rb,-b.q);p+=cb*(b.c-r2);b.q+=cb;rb-=cb}if(rb>0){var nq=b.q+rb;b.c=(b.q*b.c+rb*r2)/nq;b.q=nq}t.p=p;total+=p;if(p)daily[t.d]=(daily[t.d]||0)+p;return}

 Array.from(document.getElementById('app').children).forEach(function(el){if(el.classList.contains('day')){fin();cur=el;vis=0}else if(el.hasAttribute('data-id')){var t=S.tx.find(function(x){return x.id===+el.getAttribute('data-id')}),ok=!SQ||!t||txMatch(t,SQ);el.style.display=ok?'':'none';if(ok)vis++}});fin()}
function hSearch(v){SQ=v;applyHist()}
function rSearch(v){SQ=v;var el=document.getElementById('rres');if(el)el.innerHTML=rpResult()}
function decorate(){document.querySelectorAll('#app button.x').forEach(function(b){var m=/del\((\d+)\)/.exec(b.getAttribute('onclick')||'');if(!m)return;var id=+m[1],t=S.tx.find(function(x){return x.id===id}),row=b.closest('.box'),p=b.parentNode;
 var e=document.createElement('button');e.className='x';e.style.cssText='flex:0 0 auto;color:var(--ac)';e.textContent='ویرایش';e.setAttribute('onclick','edit('+id+')');p.insertBefore(e,b);
 if(!t)return;row.setAttribute('data-id',id);
 if(t.att){var a=document.createElement('button');a.className='x';a.style.cssText='flex:0 0 auto;color:var(--ac)';a.textContent='سند';a.setAttribute('onclick','showAtt(\''+t.att.id+'\')');p.insertBefore(a,e)}
 if(t.n){var nd=document.createElement('div');nd.className='k';nd.textContent=t.n;p.firstElementChild.appendChild(nd)}});
 var sb=document.getElementById('sq');if(sb)sb.value=SQ;applyHist()}
function appBack(){if(document.getElementById('av')){closeAtt();return true}var lk=document.getElementById('lk');if(lk&&lk.style.display==='flex')return false;
 if(EDIT){EDIT=null;PEND=null;msg=null;tab='his';render();return true}
 if(tab!=='sum'){go('sum');return true}
 return false}
function addTx(){var n=S.tx.length,e=EDIT,note=(val('nt')||'').trim(),old=e?S.tx.find(function(x){return x.id===e}):null;
 if(type==='conv')addConv();else addTxBase();
 if(S.tx.length>n){var nt=S.tx[S.tx.length-1];
  if(note)nt.n=note;
  if(PEND){nt.att={id:PEND.id,type:PEND.type,name:PEND.name};idbPut(PEND.id,PEND.data);if(old&&old.att)idbDel(old.att.id)}else if(old&&old.att)nt.att=old.att;
  PEND=null;
  if(e){var x=S.tx.pop();S.tx=S.tx.filter(function(y){return y.id!==e});x.id=e;S.tx.push(x);EDIT=null;msg={t:'ویرایش شد.'}}
  save();render()}}
function bkOut(){if(!(NB&&AndroidBio.saveBackup))return bkFile();
 idbAll().then(function(att){var o=Object.assign({},S),n=Object.keys(att).length;if(n)o.att=att;var t=JSON.stringify(o);AndroidBio.saveBackup(t);msg={t:'فایل پشتیبان در پوشه‌ی Download ذخیره شد'+(n?' (همراه با '+n+' سند)':'')+'.'};render();if(!n){var el=document.getElementById('bk');if(el)el.value=t}})}
function bkIn(){try{var o=JSON.parse(val('bk'));if(!o.cur||!o.tx)throw 0;if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;var A=o.att;delete o.att;S=o;save();if(A)Object.keys(A).forEach(function(k){idbPut(k,A[k])});msg={t:'بازیابی شد.'};render()}catch(e){msg={e:1,t:'متن پشتیبان معتبر نیست.'};render()}}

var SGL=[];
function sugWords(){var m={};function add(w){w=(w||'').trim();if(w.length<2||/^[\d.\/\-]+$/.test(w))return;var k=nrm(w);if(!m[k])m[k]={w:w,c:0};m[k].c++}
 S.tx.forEach(function(t){(t.n||'').split(/[\s،,.;:()\-\/]+/).forEach(add);add(t.cu);if(t.cu2)add(t.cu2)});return Object.keys(m).map(function(k){return m[k]})}
function showSug(inId,boxId){var i=document.getElementById(inId),b=document.getElementById(boxId);if(!i||!b)return;var v=i.value,parts=v.split(/\s+/),frag=nrm(parts[parts.length-1]||'');
 if(!frag||/\s$/.test(v)){b.innerHTML='';return}
 SGL=sugWords().filter(function(x){var k=nrm(x.w);return k.indexOf(frag)>=0&&k!==frag}).sort(function(a,b){var pa=nrm(a.w).indexOf(frag)===0?0:1,pb=nrm(b.w).indexOf(frag)===0?0:1;return pa-pb||b.c-a.c||a.w.length-b.w.length}).slice(0,8);
 b.innerHTML=SGL.map(function(x,n){return '<button class="chip" onclick="pickSug(\''+inId+'\',\''+boxId+'\','+n+')">'+esc(x.w)+'</button>'}).join('')}
function pickSug(inId,boxId,n){var i=document.getElementById(inId),x=SGL[n];if(!i||!x)return;var parts=i.value.split(/\s+/);parts[parts.length-1]=x.w;i.value=parts.join(' ')+' ';document.getElementById(boxId).innerHTML='';if(inId==='sq')hSearch(i.value);else rSearch(i.value);i.focus()}
function hSearch(v){SQ=v;applyHist();showSug('sq','sg')}
function rSearch(v){SQ=v;var el=document.getElementById('rres');if(el)el.innerHTML=rpResult();showSug('sq2','sg2')}
function fabSync(){var f=document.getElementById('fab');if(tab==='add'){if(!f){f=document.createElement('button');f.id='fab';f.setAttribute('aria-label','ثبت');f.innerHTML=sv('<path d="M5 13l4 4L19 7" stroke-width="2.6"/>');f.onclick=function(){addTx()};document.body.appendChild(f)}}else if(f)f.remove()}

applyTheme();render();if(LK)showLock();
</script>
