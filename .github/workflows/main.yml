name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/sarrafi app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml
          mv MainActivity.kt app/src/main/java/com/example/sarrafi/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv app-build.gradle.kts app/build.gradle.kts
          mv ic_bg.xml ic_fg.xml app/src/main/res/drawable/
          mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          mv file_paths.xml app/src/main/res/xml/file_paths.xml
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/ks.p12"
            echo "KS_FILE=$GITHUB_WORKSPACE/ks.p12" >> "$GITHUB_ENV"
            echo "Using fixed signing key"
          else
            echo "No signing secret found: using the default debug key"
          fi
      - name: Build
        run: |
          if [ -n "$KS_FILE" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sarrafi-apk
          path: app/build/outputs/apk/**/*.apk
