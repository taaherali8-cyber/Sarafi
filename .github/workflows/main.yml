name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/sarrafi app/src/main/assets app/src/main/res/drawable
          mv MainActivity.kt app/src/main/java/com/example/sarrafi/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv app-build.gradle.kts app/build.gradle.kts
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0B6E63" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M30,36h48v8h-48z M30,50h48v8h-48z M30,64h32v8h-32z"/></vector>' > app/src/main/res/drawable/ic_launcher.xml
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sarrafi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
